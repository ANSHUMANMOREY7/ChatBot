<!DOCTYPE html>
<html lang="en">

<head>
    <title>ChatBot</title>
</head>
<style>
    body{
        margin-top: 0px;
        margin-bottom: 0px;
        font-family: Arial;
    }
    .send-btn{
        background-color: rgba(73, 177, 45);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
    
    }
    .chat-input{
        padding: 12px 15px;
        border-radius: 10px;
        border-width:1px ;
        font-size: 15px;
        flex-grow: 1;
        border: 1px solid grey;
        

    }
    .chat-input:focus{
        outline: none;
        border-color: grey;
        box-shadow: none;
    }
    .chat-input-container{
        display: flex;
        margin-top: 20px;
        margin-bottom: 20px;
        
    }
    .input-position-control{
        align-self: center;
        margin: 20px 0;
        padding: 0;
        border: none;
        background: none;
        color: #267a56;
        font-size: 12px;
        cursor: pointer;
    }
    .input-position-control:hover{
        text-decoration: underline;
    }
    .app-container{
        max-width: 600px;
        margin-left: auto ;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;

    }
    .chat-message-user{
        display: flex;
        justify-content:end;
        align-items: start;
    }
    .chat-message-robot{
        display: flex;     
        align-items: start;
        
        
    }
    .chat-msg-text{
        background-color: rgb(238,238,238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
    }
    .chat-msg-profile{
        width: 55px;
    }
    .chat-msg-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
    }
</style>
<body>
    
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


        function ChatInput({ chatMessages , setChatMessages}) {
            const [ inputText , setInputText ]=React.useState('');

            function saveInputChnage(event){
                setInputText(event.target.value);
            }

            const newChatMessages=[
                ...chatMessages,
                {
                    message: inputText,
                    sender:'user',
                    id: crypto.randomUUID()
                }
            ]

            function sendMessage(){

                  setChatMessages(newChatMessages);

            const response=Chatbot.getResponse(inputText);
            (response)

             setChatMessages([

                ...newChatMessages,
                {
                    message: response,
                    sender:'robot',
                    id: crypto.randomUUID()
                }
            ]);

            setInputText('')
            }
            return (
                <div className="chat-input-container" >
                    <input className="chat-input"
                        placeholder="send a message to ChatBot"
                        size="30" 
                        onChange={saveInputChnage}
                        value={inputText}
                    />
                    <button onClick={sendMessage} className="send-btn" >Send</button>
                </div>
            );
        }

        function ChatMessage({ message, sender }) {
            // const message=props.message;
            // const sender=props.sender;

            // const {message , sender}=props;

            /*  if(sender === "robot") {
            return(<div>
                {message}
                <img src="robot.png" width="50"/>
                </div>);
            }*/
            return (
                <div className={ sender==='user'?'chat-message-user':'chat-message-robot'}>
                    {sender === "robot" && <img src="robot2.png" className="chat-msg-profile"/>}
                    <div className="chat-msg-text">
                        {message} 
                    </div>
                        {sender === "user" && <img src="user1.png" className="chat-msg-profile" />}
                </div>
            );
        }
        function ChatMessages({chatMessages}) {
            const chatMessagesRef = React.useRef(null);

           React.useEffect(()=>{
           const containerElem= chatMessagesRef.current;
           if(containerElem){
            containerElem.scrollTop=containerElem.scrollHeight;
           }
           } ,[chatMessages]);

            return (
                <div className="chat-msg-container" ref={chatMessagesRef}>
                    {chatMessages.map((chatMessage) => {
                        return (

                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id} />
                        );

                    })}
                </div>
            );
        }

        function App() {
             const [chatMessages , setChatMessages] = React.useState([{ message: "hello chatbot", sender: 'user', id: 1 },
                { message: "how can i help you?", sender: "robot", id: 2 },
                { message: "Can you get me todays Date?", sender: "user", id: 3 },
                { message: "Today is September 5 2026", sender: "robot", id: 4 }]
            );
            const [inputAtTop, setInputAtTop] = React.useState(true);
           // const[chatMessages , setChatMessages]= array;
           // const chatMessages = array[0];
           //const setChatMessages = array[1];

            return (
                <div className="app-container">
                    {inputAtTop && <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />}
                    <ChatMessages chatMessages={chatMessages} />
                    {!inputAtTop && <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />}
                    <button
                        className="input-position-control"
                        onClick={() => setInputAtTop(!inputAtTop)}
                    >
                        {inputAtTop ? 'Move input below messages' : 'Move input above messages'}
                    </button>
                </div>
            )
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
